{% load static %}
<header class="site-header">
  <div class="header-main container">
    <a class="brand" href="{% url 'core:home' %}" aria-label="BICO — início">
      <img class="brand__image" src="{% static 'branding/logos/logo-bico-sem-fundo.png' %}" alt="BICO" width="76" height="64">
    </a>
    <form class="header-search" action="{% url 'core:search' %}" method="get" role="search">
      <label class="visually-hidden" for="site-search">Procure por serviços</label>
      <input id="site-search" type="search" name="q" placeholder="Procure por serviços ou profissionais..." value="{{ request.GET.q|default:'' }}" maxlength="100">
      <label class="visually-hidden" for="site-city">Cidade</label>
      <input id="site-city" class="header-search__city" type="text" name="cidade" placeholder="Cidade" value="{{ request.GET.cidade|default:'' }}" maxlength="100">
      <button class="header-search__submit" type="submit" aria-label="Buscar"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.7"></circle><path d="m16 16 5 5"></path></svg></button>
    </form>
    <nav class="header-actions" aria-label="Ações da conta">
      <a href="{% url 'core:info' 'conversar' %}" aria-label="Conversas"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 11.4a8.5 8.5 0 0 1-8.8 8.1 9.5 9.5 0 0 1-4-.9L3 20l1.5-4a7.7 7.7 0 0 1-1.3-4.3 8.5 8.5 0 0 1 8.5-8.2 8.5 8.5 0 0 1 8.8 7.9Z"></path></svg><span>Chat</span></a>
      <a href="{% url 'core:info' 'notificacoes' %}" aria-label="Notificações"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4"></path></svg><span>Notificações</span></a>
      {% if request.user.is_authenticated %}
        <a class="header-login" href="{% url 'core:info' 'minha-conta' %}">Minha conta</a>
      {% else %}
        <a class="header-login" href="{% url 'core:info' 'entrar' %}">Entrar</a>
      {% endif %}
    </nav>
  </div>
  {% include "components/category_navigation.html" %}
</header>
