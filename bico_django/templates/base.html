{% load static %}
<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#FF5308">
    <title>{% block title %}BICO — Serviços perto de você{% endblock %}</title>
    <link rel="icon" href="{% static 'branding/favicon/favicon.ico' %}" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'branding/favicon/favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'branding/favicon/favicon-16x16.png' %}">
    <link rel="apple-touch-icon" href="{% static 'branding/favicon/apple-touch-icon.png' %}">
    <link rel="manifest" href="{% static 'branding/favicon/site.webmanifest' %}">
    <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/components.css' %}">
    <link rel="stylesheet" href="{% static 'css/site.css' %}">
  </head>
  <body>
    {% block content %}{% endblock %}
  </body>
</html>
